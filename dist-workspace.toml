[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "tehubersheezy/homebrew-sn"
# Customize the Homebrew formula name
formula = "sn"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# release.yml is hand-edited on top of the dist output (SHA-pinned actions,
# job-scoped token permissions, hash-verified installer downloads — see
# CLAUDE.md "CI/CD"); without this, `dist plan` in the release workflow fails
# on the drift. Re-running `dist generate` reverts those edits — re-apply them.
allow-dirty = ["ci"]

# Pin ARM64 Windows builds to a native Windows runner. The default Linux
# runner can't cross-compile `ring` (TLS dep) to aarch64-pc-windows-msvc
# because its build script emits MSVC `/imsvc` flags that clang on Linux
# rejects.
[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-latest"
