# Keeps Cargo.lock's transitive pins fresh, so a yanked crate or a patched
# advisory self-heals instead of leaving the daily Security run red until a
# human runs `cargo update` by hand (chacha20 0.10.1's yank did exactly that,
# 2026-08-28 through 08-31). Dependabot cannot cover this gap: its cargo
# version updates track manifest-direct dependencies, and a yank is not an
# advisory, so lockfile-only transitive deps fall through both nets.
#
# Two GitHub quirks shape the design — the first is the same event
# suppression documented on attach-provenance.yml:
#
#   1. A PR opened with a workflow's own GITHUB_TOKEN gets no usable
#      pull_request runs. Measured on this job's first live run: the events
#      DO fire, but every run parks as `action_required` ("requires
#      approval"), starts no jobs, and reports no contexts until a human
#      clicks Approve and run — weekly, forever. Main's ruleset requires
#      the `test (…)` and `msrv` contexts, so an undispatched PR could
#      never merge unattended.
#   2. Rulesets evaluate PR-associated check suites, not bare commit check
#      runs. Measured: with the head SHA fully green from dispatched
#      workflow_dispatch runs (the documented exception to GITHUB_TOKEN
#      event suppression), the merge still fails with "the base branch
#      policy prohibits the merge" — so dispatching CI at the branch can
#      never unblock the PR, and the approve step below is the whole
#      mechanism. Also measured: GITHUB_TOKEN may approve the runs its own
#      PR parked (given `actions: write` and the setting below), so the
#      loop runs unattended end to end — proven by bot PR #98, which went
#      refresh → self-approved native runs → MERGE STATE CLEAN with no
#      human touch.
#
# One rolling branch (bot/lockfile-refresh), force-pushed: an unmerged
# refresh is superseded, its open PR just gains the newer commit, and the
# checks are re-dispatched for the new head.
#
# Prerequisite (a third gate, separate from both quirks above and from this
# job's `permissions:` block): the repo setting "Allow GitHub Actions to
# create and approve pull requests" must be ON, or `gh pr create` fails with
# "GitHub Actions is not permitted to create or approve pull requests" —
# measured on this job's first live run. Enabled 2026-08-31 via
#   gh api -X PUT repos/{owner}/{repo}/actions/permissions/workflow \
#     -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true
# (default token permissions stay read; only PR creation is unlocked).
#
# Weekly, plus manual. If a scheduled Security run goes red midweek on a
# yanked crate, don't wait for Monday:
#
#   gh workflow run lockfile-refresh.yml
name: Lockfile refresh

on:
  schedule:
    # Mondays 05:00 UTC, alongside Dependabot's weekly pass.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open/update the PR
      actions: write # approve the PR's parked pull_request runs
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: bot/lockfile-refresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Refresh the lockfile
        id: update
        run: |
          cargo update 2>&1 | tee /tmp/cargo-update.log
          if git diff --quiet Cargo.lock; then
            echo "lockfile already current; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat Cargo.lock
          fi

      - name: Push the refresh branch
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Cargo.lock
          # The update log in the commit body is the record of what moved.
          git commit -m "chore(deps): refresh Cargo.lock (scheduled)" \
                     -m "$(grep -v '^ *Updating crates.io index' /tmp/cargo-update.log)"
          git push --force origin "$BRANCH"

      - name: Open or update the PR
        if: steps.update.outputs.changed == 'true'
        run: |
          {
            echo "Automated weekly \`cargo update\`. Keeps transitive pins current so"
            echo "yanked crates and patched advisories don't strand the scheduled"
            echo "Security run red (Dependabot doesn't reach lockfile-only deps)."
            echo
            echo '```'
            grep -v '^ *Updating crates.io index' /tmp/cargo-update.log
            echo '```'
            echo
            echo "> [!NOTE]"
            echo "> This PR's own pull_request runs park as action_required; the"
            echo "> workflow approves them right after opening the PR, and only those"
            echo "> native runs satisfy main's required contexts (test ×3, msrv). If a"
            echo "> run still shows as awaiting approval, the token wasn't allowed to"
            echo "> approve it — one manual Approve-and-run click unblocks the merge."
          } > /tmp/pr-body.md
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -z "$existing" ]; then
            gh pr create --head "$BRANCH" \
              --title "chore(deps): refresh Cargo.lock" \
              --body-file /tmp/pr-body.md
          else
            gh pr edit "$existing" --body-file /tmp/pr-body.md
          fi

      - name: Approve the PR's parked workflow runs
        if: steps.update.outputs.changed == 'true'
        run: |
          # The PR's own pull_request runs park as action_required, and only
          # they can satisfy main's required contexts (header, quirk 2).
          # GITHUB_TOKEN approving them is measured working; the warning arm
          # stays because a policy change flipping it off must degrade to one
          # manual click, not to a failed refresh that otherwise worked.
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 12); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request&status=action_required" \
              --jq ".workflow_runs[] | select(.head_sha == \"$sha\") | .id")
            [ -n "$runs" ] && break
            sleep 5
          done
          if [ -z "$runs" ]; then
            echo "::warning::no parked pull_request runs appeared for $sha; approve them manually from the PR's checks tab"
            exit 0
          fi
          for id in $runs; do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null 2>&1; then
              echo "approved run $id"
            else
              echo "::warning::could not approve run $id (GITHUB_TOKEN may not approve runs it caused); approve manually: gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
            fi
          done
