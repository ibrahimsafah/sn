name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by SHA the toolchain no longer rides the ref name, so it is
      # passed explicitly below.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --workspace

  # allow-dirty = ["ci"] turned off dist's own release.yml drift check, so
  # nothing else would notice a `dist generate` reverting the SHA pins or
  # reintroducing a piped installer. This does.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action pinned by SHA, no piped installers
        run: |
          set -eu
          # Anchored to the YAML key so the guard cannot match its own script.
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ | grep -vE '@[0-9a-f]{40}' || true)
          if [ -n "$bad" ]; then
            printf 'action refs not pinned by commit SHA:\n%s\n' "$bad" >&2
            exit 1
          fi
          piped=$(grep -rnE 'curl[^|]*\|[[:space:]]*(ba)?sh' .github/workflows/ | grep -vE ':[0-9]+:[[:space:]]*#' || true)
          if [ -n "$piped" ]; then
            printf 'piped installer (curl | sh) in a workflow:\n%s\n' "$piped" >&2
            exit 1
          fi

  # Proves the rust-version in Cargo.toml still builds the locked tree.
  # The 1.75 claim rotted silently because nothing checked it; this does.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-features --workspace --locked
